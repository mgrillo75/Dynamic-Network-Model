[project]
name = "voltagrid-tx3-copilot"
version = "0.1.0"
description = "VoltaGrid TX-3 core islanded microgrid simulation copilot."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "VoltaGrid TX-3 Simulation POC" }]

dependencies = [
    "litellm>=1.52",
    "pydantic>=2.8",
    "typer>=0.12",
    "pyyaml>=6.0",
    "streamlit>=1.38",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
voltagrid-tx3 = "voltagrid_tx3.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voltagrid_tx3"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
